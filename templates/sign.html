<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/auth.js') }}" defer></script>
</head>
<body>
    <div class="container">
        <!-- Sign-Up Form -->
        <div class="form-container" id="signup-form">
            <h2>Sign Up</h2>
            <form id="signup">
                <input type="text" id="name" placeholder="Full Name" required>
                <input type="email" id="email-signup" placeholder="Email" required>
                <input type="password" id="password-signup" placeholder="Password" required>
                <button type="button" onclick="sendOTP()">Send OTP</button>
                <div id="otp-section" style="display: none;">
                    <input type="text" id="otp" placeholder="Enter OTP" required>
                    <button type="button" onclick="verifyOTP()">Verify & Sign Up</button>
                </div>
            </form>
            <p>Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
        </div>

        <!-- Login Form -->
        <div class="form-container" id="login-form" style="display: none;">
            <h2>Login</h2>
            <form id="login">
                <input type="email" id="email-login" placeholder="Email" required>
                <input type="password" id="password-login" placeholder="Password" required>
                <button type="button" onclick="login()">Login</button>
            </form>
            <p>Don't have an account? <a href="#" onclick="showSignup()">Sign Up</a></p>
        </div>
    </div>
</body>
</html>
